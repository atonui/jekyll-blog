title: Kibet Koech
author:
  name: Allan Koech
description: >-
  Essays and notes on engineering, data, artificial intelligence, software,
  economics, society, learning, and the things I find worth thinking through.
tagline: >-
  Clear writing, better thoughts. Better thoughts, better decisions.
  Better decisions, better actions. Better actions, better life.
url: "https://www.kibetkoech.com"
baseurl: ""
timezone: Africa/Nairobi
lang: en
icon: /assets/images/icon-512.png

github_username: atonui

markdown: kramdown
theme: hitchens-theme

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Allan Koech"

hide_search: true
hide_credits: true
show_excerpts: true

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 5
paginate_path: "/page/:num/"

google_analytics: G-49PF6VYSLV
