{% assign chart = site.data.essay_charts[include.chart] %}
<figure class="data-chart" id="{{ chart.id }}" data-energy-chart data-figure-id="{{ chart.id }}" data-dataset-root="{{ chart.dataset_root | relative_url }}" aria-label="{{ chart.title }} chart">
  <div class="chart-interactive" hidden>
    <div class="chart-toolbar">
      <div class="chart-year-group"><label for="{{ chart.id }}-year">Explore a year</label><select id="{{ chart.id }}-year" data-year-select></select></div>
      <div class="chart-year-track"><label class="chart-sr-only" for="{{ chart.id }}-timeline">Observation year</label><input id="{{ chart.id }}-timeline" type="range" data-year-slider><div class="chart-range-labels"><span data-first-year></span><span data-last-year></span></div></div>
      <div class="chart-scale" role="group" aria-label="Axis scale"><button type="button" data-scale="log" aria-pressed="true">Log</button><button type="button" data-scale="linear" aria-pressed="false">Linear</button></div>
    </div>
    <div class="chart-comparison">
      <div class="chart-selection" data-selection aria-label="Highlighted economies"></div>
      <label class="chart-country-field" for="{{ chart.id }}-country"><span class="chart-sr-only">Find an economy to highlight</span><input id="{{ chart.id }}-country" type="search" list="{{ chart.id }}-countries" data-country-search placeholder="+ Compare a country" autocomplete="off"><datalist id="{{ chart.id }}-countries" data-country-list></datalist></label>
      <button class="chart-reset" type="button" data-reset>Reset view</button>
    </div>
    <p class="chart-guide">Highlight up to six economies. Each dot represents one economy.</p>
    <div class="chart-axis-caption">Income per person <span>PPP · constant 2021 international $</span></div>
    <div class="chart-plot" data-plot></div>
    <div class="chart-x-caption">Electricity consumption <span>kWh per person per year</span></div>
    <div class="chart-inspector"><label for="{{ chart.id }}-inspect">Inspect an economy</label><select id="{{ chart.id }}-inspect" data-inspect aria-describedby="{{ chart.id }}-detail"><option value="">Choose an economy</option></select></div>
    <div class="chart-detail" id="{{ chart.id }}-detail" data-detail aria-live="off"></div>
    <p class="chart-status" data-status role="status" aria-live="polite"></p>
    <div class="chart-actions"><button type="button" data-share>Share this view</button><button type="button" data-csv>Download data</button><button type="button" data-svg>Download SVG</button></div>
  </div>
  {% capture energy_fallback %}{% include generated/energy-income.html %}{% endcapture %}
  {{ energy_fallback | replace: "/assets/data/development/2026-11-09-fe53088a0f44/fallback.svg", "/assets/images/development-energy-fallback.svg" }}
  <figcaption class="chart-sources">
    <p><strong>Sources:</strong> <a href="https://data.worldbank.org/indicator/EG.USE.ELEC.KH.PC">World Bank / IEA electricity</a> and <a href="https://data.worldbank.org/indicator/NY.GDP.PCAP.PP.KD">World Bank real PPP income</a>. Same-year observations; no interpolation.</p>
    <p>Updated analysis · {{ chart.updated }}. <span data-snapshot-note>Snapshot {{ chart.snapshot }}.</span> <a data-manifest-link href="{{ chart.dataset_root | append: '/' | append: chart.snapshot | append: '/manifest.json' | relative_url }}">Data definitions &amp; provenance</a></p>
    <p>Association does not establish causation. Electricity consumption does not measure price, reliability, or access.</p>
  </figcaption>
</figure>
