<form method="get" id="search" class="site-search" role="search" action="https://duckduckgo.com/">
  <input type="hidden" name="sites" value="{{ site.url }}">
  <input type="hidden" name="k8" value="#222222">
  <input type="hidden" name="k9" value="#dc4b3c">
  <input type="hidden" name="kt" value="h">

  <label for="search__input" class="search-label">Search this site</label>
  <div class="search-controls">
    <input
      type="search"
      id="search__input"
      name="q"
      placeholder="Search articles and notes"
      autocomplete="off"
    >
    <button type="submit" class="btn btn-bordered search-submit">Search</button>
  </div>
</form>
