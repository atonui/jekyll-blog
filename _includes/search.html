<form
  method="get"
  id="search"
  class="site-search"
  role="search"
  action="{{ '/search/' | relative_url }}"
  data-site-search
  data-search-index="{{ '/search.json' | relative_url }}"
>
  <label for="search__input" class="search-label">Search this site</label>
  <div class="search-controls">
    <input
      type="search"
      id="search__input"
      name="q"
      placeholder="Search articles and notes"
      autocomplete="off"
      aria-controls="search-suggestions"
      aria-autocomplete="list"
    >
    <button type="submit" class="btn btn-bordered search-submit">Search</button>
  </div>
  <div id="search-status" class="search-status" aria-live="polite"></div>
  <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions"></div>
</form>
